[versions]
ksp = "2.0.21-1.0.27"
activity-compose = "1.10.1"
kotlin = "2.0.21"
core-ktx = "1.16.0"
lifecycle = "2.9.2"
compose-bom = "2025.06.01"
material3 = "1.3.2"
navigation = "2.9.3"
retrofit = "2.11.0"
okhttp = "4.12.0"
room = "2.7.2"
coroutines = "1.8.1"
coil = "2.7.0"
app = "8.11.1"
junit = "4.13.2"
junit-version = "1.2.1"
espresso-core = "3.6.1"
hilt-version = "2.51.1"
