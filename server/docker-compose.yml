# Production stack:

#   - schedule-api: FastAPI on internal Docker network only
#   - caddy: public HTTPS (80/443) → reverse proxy to API
#
# Without DOMAIN (local/dev): API still reachable on host port 8000.
# With DOMAIN set: use https://DOMAIN/  (Caddy gets Let's Encrypt certs).

services:
  schedule-api:
    build: .
    # Bind to localhost only when Caddy is in front (safer).
    # Keep 8000 for healthchecks / emergency access from the server itself.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./schedule.db}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - studentapp

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - schedule-api
    networks:
      - studentapp

networks:
  studentapp:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
